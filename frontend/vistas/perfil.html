<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Perfil - SportClub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../assets/logo.png" alt="Logo SportClub">
            <h2>SportClub</h2>
            <p>Mi Perfil</p>
        </div>

        <nav class="sidebar-menu">
            <a href="#" id="linkInicio">Inicio</a>
            <a href="perfil.html" class="active">Perfil</a>
        </nav>

        <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
    </aside>

    <main class="main-content">
        <div class="dashboard-card">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="dashboard-title">Mi Perfil</h1>
                    <p class="dashboard-subtitle">
                        Gestiona tu información personal y actualiza tu contraseña.
                    </p>
                    <span id="profileRole" class="role-badge">rol</span>
                </div>

                <div class="col-md-4 text-center">
                    <img src="../assets/perfil.png" alt="Perfil" class="dashboard-avatar">
                </div>
            </div>
        </div>

        <div id="profileMessage" class="mb-3"></div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="dashboard-card text-center">
                    <img src="../assets/perfil.png" alt="Avatar perfil" class="dashboard-avatar">

                    <h3 id="profileName" class="dashboard-title mb-2">Cargando...</h3>
                    <p id="profileEmail" class="dashboard-subtitle mb-2">correo@demo.cl</p>
                    <span id="profileRoleCard" class="role-badge">rol</span>

                    <hr>

                    <p class="mb-1"><strong>Fecha de nacimiento:</strong></p>
                    <p id="profileBirthDate" class="dashboard-subtitle">-</p>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="dashboard-card">
                    <h3 class="dashboard-title mb-3">Información Personal</h3>

                    <form id="profileForm" novalidate>
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Nombre completo</label>
                            <input type="text" id="full_name" class="form-control">
                            <div id="full_nameError" class="error-text"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" id="email" class="form-control" disabled>
                            <div id="emailError" class="error-text"></div>
                        </div>

                        <div class="mb-3">
                            <label for="birth_date" class="form-label">Fecha de nacimiento</label>
                            <input type="date" id="birth_date" class="form-control">
                            <div id="birth_dateError" class="error-text"></div>
                        </div>

                        <div class="mb-3">
                            <label for="metadata" class="form-label">Datos adicionales</label>
                            <textarea id="metadata" class="form-control" rows="3" placeholder="Ej: intereses, deporte favorito, observaciones"></textarea>
                            <div id="metadataError" class="error-text"></div>
                        </div>

                        <button type="submit" class="btn btn-success">Guardar cambios</button>
                    </form>
                </div>

                <div class="dashboard-card">
                    <h3 class="dashboard-title mb-3">Cambiar Contraseña</h3>

                    <form id="passwordForm" novalidate>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="current_password" class="form-label">Contraseña actual</label>
                                <input type="password" id="current_password" class="form-control">
                                <div id="current_passwordError" class="error-text"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="new_password" class="form-label">Nueva contraseña</label>
                                <input type="password" id="new_password" class="form-control">
                                <div id="new_passwordError" class="error-text"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label for="confirm_password" class="form-label">Confirmar contraseña</label>
                                <input type="password" id="confirm_password" class="form-control">
                                <div id="confirm_passwordError" class="error-text"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom">Actualizar contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/validators.js"></script>
<script src="../js/perfil.js"></script>
</body>
</html>
