<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SportClub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-logo">
        <img src="../assets/logo.png" alt="Logo SportClub" class="auth-logo-img">
        <h1>Sport<span>Club</span></h1>
        <p>Inicia sesión en tu cuenta</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" autocomplete="email">
            <div id="emailError" class="error-text"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" autocomplete="current-password">
            <div id="passwordError" class="error-text"></div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100">Iniciar sesión</button>

        <div id="loginMessage" class="error-text text-center mt-3"></div>

        <p class="text-center mt-3 mb-0">
            ¿No tienes cuenta?
            <a href="register.html">Regístrate</a>
        </p>

        <p class="text-center mt-2 mb-0">
            <a href="../index.html" class="text-decoration-none">Volver al inicio</a>
        </p>
    </form>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/validators.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
