<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - SportClub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-logo">
        <h1>Sport<span>Club</span></h1>
        <p>Crea tu cuenta de usuario</p>
    </div>

    <form id="registerForm" novalidate>
        <div class="mb-3">
            <label for="full_name" class="form-label">Nombre completo</label>
            <input type="text" id="full_name" class="form-control" autocomplete="name">
            <div id="full_nameError" class="error-text"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" autocomplete="email">
            <div id="emailError" class="error-text"></div>
        </div>

        <div class="mb-3">
            <label for="birth_date" class="form-label">Fecha de nacimiento</label>
            <input type="date" id="birth_date" class="form-control">
            <div id="birth_dateError" class="error-text"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" autocomplete="new-password">
            <div id="passwordError" class="error-text"></div>
        </div>

        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirmar contraseña</label>
            <input type="password" id="confirm_password" class="form-control" autocomplete="new-password">
            <div id="confirm_passwordError" class="error-text"></div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100">Registrarme</button>

        <div id="registerMessage" class="success-text text-center"></div>

        <p class="text-center mt-3 mb-0">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>
    </form>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/validators.js"></script>
<script src="../js/register.js"></script>
</body>
</html>
